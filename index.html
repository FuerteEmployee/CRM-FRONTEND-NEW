<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=block" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=block" rel="stylesheet" media="all" />
    <title>CRMPro - Management Dashboard</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#1e293b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function() {
        try {
          const cachedFavicon = localStorage.getItem("crm_favicon");
          if (cachedFavicon) {
            const link = document.querySelector("link[rel*='icon']");
            if (link) {
              link.href = cachedFavicon;
            }
          }
          const cachedTitle = localStorage.getItem("crm_company_name");
          if (cachedTitle) {
            document.title = cachedTitle;
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
    <meta name="description" content="CRMPro - Complete CRM and team management platform" />
    <meta name="author" content="Lovable" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="CRMPro Dashboard" />
    <meta property="og:description" content="A powerful CRM, sales, and team management platform." />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CRMPro Dashboard" />
    <meta name="twitter:description" content="A powerful CRM, sales, and team management platform." />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
